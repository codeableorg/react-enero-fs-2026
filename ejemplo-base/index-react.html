<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client"
        }
      }
    </script>

    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      // crear el objeto 'root' de React vinculado al nodo del DOM con id "root"
      const root = createRoot(document.querySelector('#root'));

      // Crear el elemento usando la función createElement de la biblioteca React:

      const element = React.createElement(
        'div',
        { className: 'container' },
        React.createElement('h2', null, 'Hola Mundo'),
        React.createElement('p', null, 'Hoy aprenderemos algo de React')
      );
      // Renderizar el elemento usando la función render del objeto 'root'
      root.render(element);
    </script>
  </body>
</html>
